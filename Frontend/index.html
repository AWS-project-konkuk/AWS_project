<!doctype html>
<html lang="ko">
  <head>
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('blockml:preferences:v1') || '{}');
        var t = p.theme;
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090e17" />
    <meta
      name="description"
      content="AWS 기초부터 Docker, Kubernetes, 모델 운영까지, 개념을 읽고 노드 실습으로 MLOps의 전체 흐름을 배우는 한국어 학습 사이트"
    />
    <title>BlockML | MLOps 학습 과정</title>

    <!-- 링크를 공유할 때 보이는 미리보기(Open Graph, 트위터 카드). 이미지 주소는 SITE_URL로 절대 주소를 만든다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BlockML" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="BlockML | MLOps 학습실" />
    <meta
      property="og:description"
      content="개념을 읽고, 노드를 직접 연결해 실행하며 배우는 MLOps. EC2·S3부터 Docker·Kubernetes, GPU, RAG, 모델 서빙·모니터링까지 전체 흐름을 익힙니다."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="BlockML 노드 실습 화면. 입력 소스, 저장소, EC2, 모델 레지스트리, Gateway가 선으로 연결된 MLOps 워크플로우"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BlockML | MLOps 학습실" />
    <meta
      name="twitter:description"
      content="개념을 읽고, 노드를 직접 연결해 실행하며 배우는 MLOps 학습 사이트"
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
