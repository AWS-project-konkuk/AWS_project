<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title"><title id="title">문서와 질문은 같은 임베딩 모델을 씁니다</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">문서와 질문은 같은 임베딩 모델을 씁니다</text><rect x="30" y="85" width="900" height="180" rx="14" fill="white"/><text x="50" y="119" font-size="18" fill="#008474" font-weight="700" text-anchor="start">같은 모델로 저장·질문</text><rect x="50" y="141" width="190" height="70" rx="14" fill="white"/><rect x="50" y="153" width="5" height="46" rx="2.5" fill="#7a869a"/><text x="147.0" y="172.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">문서</text><text x="147.0" y="198.0" font-size="14" fill="#4a5d78" font-weight="400" text-anchor="middle">저장 시점</text><path d="M242 176L288 176" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><rect x="292" y="141" width="170" height="70" rx="14" fill="white"/><rect x="292" y="153" width="5" height="46" rx="2.5" fill="#456bbb"/><text x="379.0" y="172.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">모델 A</text><text x="379.0" y="198.0" font-size="14" fill="#4a5d78" font-weight="400" text-anchor="middle">384차원</text><path d="M464 176L510 176" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><rect x="514" y="131" width="150" height="90" rx="12" fill="#e0eafe"/><text x="589" y="183" font-size="18" fill="#456bbb" font-weight="700" text-anchor="middle">벡터 DB</text><rect x="700" y="131" width="210" height="90" rx="12" fill="#d9f2ea"/><text x="805" y="167" font-size="16" fill="#008474" font-weight="700" text-anchor="middle">질문 → 모델 A</text><text x="805" y="197" font-size="16" fill="#008474" font-weight="700" text-anchor="middle">관련 문서가 상위에</text><path d="M698 176L668 176" fill="none" stroke="#008474" stroke-width="3" marker-end="url(#a-green)"/><rect x="30" y="290" width="900" height="180" rx="14" fill="white"/><text x="50" y="324" font-size="18" fill="#b3261e" font-weight="700" text-anchor="start">저장은 A, 질문은 B — 차원은 같아도</text><rect x="50" y="346" width="190" height="70" rx="14" fill="white"/><rect x="50" y="358" width="5" height="46" rx="2.5" fill="#7a869a"/><text x="147.0" y="377.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">문서</text><text x="147.0" y="403.0" font-size="14" fill="#4a5d78" font-weight="400" text-anchor="middle">저장 시점</text><path d="M242 381L288 381" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><rect x="292" y="346" width="170" height="70" rx="14" fill="white"/><rect x="292" y="358" width="5" height="46" rx="2.5" fill="#456bbb"/><text x="379.0" y="377.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">모델 A</text><text x="379.0" y="403.0" font-size="14" fill="#4a5d78" font-weight="400" text-anchor="middle">384차원</text><path d="M464 381L510 381" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><rect x="514" y="336" width="150" height="90" rx="12" fill="#e0eafe"/><text x="589" y="388" font-size="18" fill="#456bbb" font-weight="700" text-anchor="middle">벡터 DB</text><rect x="700" y="336" width="210" height="90" rx="12" fill="#fde4e1"/><text x="805" y="372" font-size="16" fill="#b3261e" font-weight="700" text-anchor="middle">질문 → 모델 B (384차원)</text><text x="805" y="402" font-size="16" fill="#b3261e" font-weight="700" text-anchor="middle">거리 비교가 의미 없음</text><path d="M698 381L668 381" fill="none" stroke="#b3261e" stroke-width="3" marker-end="url(#a-red)"/><text x="30" y="510" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">차원 수가 같다는 것은 "계산이 가능하다"는 뜻일 뿐, 두 모델이 같은 의미 공간을 쓴다는 뜻은 아닙니다.</text><text x="30" y="536" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">모델을 바꾸면 저장된 문서 전체를 같은 모델로 다시 임베딩해야 합니다.</text></g></svg>