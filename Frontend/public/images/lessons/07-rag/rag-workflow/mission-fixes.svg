<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">미션에서 고쳐야 할 두 지점</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">미션에서 고쳐야 할 두 지점</text><text x="30" y="107" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">① 질문 임베딩 공간</text><rect x="30" y="125" width="440" height="130" rx="14" fill="#fde4e1"/><rect x="48" y="143" width="64" height="30" rx="15" fill="white"/><text x="80" y="164" font-size="15" fill="#b3261e" font-weight="700" text-anchor="middle">실패</text><text x="130" y="165" font-size="19" fill="#b3261e" font-weight="700" text-anchor="start">다른 모델의 벡터 공간</text><text x="130" y="205" font-size="17" fill="#142e4e" font-weight="600" text-anchor="start">→ 무관한 문서가 상위로</text><rect x="490" y="125" width="440" height="130" rx="14" fill="#d9f2ea"/><rect x="508" y="143" width="64" height="30" rx="15" fill="white"/><text x="540" y="164" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">개선</text><text x="590" y="165" font-size="19" fill="#008474" font-weight="700" text-anchor="start">저장 문서와 같은 벡터 공간</text><text x="590" y="205" font-size="17" fill="#142e4e" font-weight="600" text-anchor="start">→ 관련 문서가 상위로</text><path d="M472 190L488 190" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><text x="30" y="307" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">② 검색과 답변</text><rect x="30" y="325" width="440" height="130" rx="14" fill="#fde4e1"/><rect x="48" y="343" width="64" height="30" rx="15" fill="white"/><text x="80" y="364" font-size="15" fill="#b3261e" font-weight="700" text-anchor="middle">실패</text><text x="130" y="365" font-size="19" fill="#b3261e" font-weight="700" text-anchor="start">공간 불일치로 검색 차단</text><text x="130" y="405" font-size="17" fill="#142e4e" font-weight="600" text-anchor="start">→ 답변이 도착하지 않음</text><rect x="490" y="325" width="440" height="130" rx="14" fill="#d9f2ea"/><rect x="508" y="343" width="64" height="30" rx="15" fill="white"/><text x="540" y="364" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">개선</text><text x="590" y="365" font-size="19" fill="#008474" font-weight="700" text-anchor="start">반품 정책 문서 doc-return</text><text x="590" y="405" font-size="17" fill="#142e4e" font-weight="600" text-anchor="start">→ 근거 ID가 붙은 답변</text><path d="M472 390L488 390" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><text x="30" y="500" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">연결만 맞는다고 끝이 아닙니다. 차원·모델·전처리를 맞춘 뒤 검색 결과를 직접 읽고,</text><text x="30" y="526" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">생성된 답이 전달한 근거를 따르는지까지 확인해야 두 경로가 제대로 이어진 것입니다.</text></g></svg>