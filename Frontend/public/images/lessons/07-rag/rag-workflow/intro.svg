<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title"><title id="title">문서 임베딩 · 질문 임베딩 · 검색 근거</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="30" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><rect x="50" y="60" width="320" height="232" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><circle cx="210.0" cy="126" r="48" fill="#e0eafe"/><g transform="translate(210.0 126) scale(0.85)"><g fill="none" stroke="#456bbb" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-22 -32H6L24 -14V32H-22Z M6 -32V-14H24M-12 2H12M-12 14H12"/></g></g><circle cx="80" cy="90" r="17" fill="#456bbb"/><text x="80" y="97" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="210.0" y="206" font-size="32" fill="#142e4e" font-weight="700" text-anchor="middle">문서 임베딩</text><text x="210.0" y="242" font-size="22" fill="#64748b" font-weight="400" text-anchor="middle">색인하기 전에</text><text x="210.0" y="270" font-size="22" fill="#64748b" font-weight="400" text-anchor="middle">벡터로 변환</text><rect x="440" y="60" width="320" height="232" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><circle cx="600.0" cy="126" r="48" fill="#d9f2ea"/><g transform="translate(600.0 126) scale(0.85)"><g fill="none" stroke="#008474" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><rect x="-32" y="-26" width="64" height="42" rx="12"/><path d="M-10 16L-16 32L4 16M-14 -8H14M-14 4H4"/></g></g><circle cx="470" cy="90" r="17" fill="#008474"/><text x="470" y="97" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="600.0" y="206" font-size="32" fill="#142e4e" font-weight="700" text-anchor="middle">질문 임베딩</text><text x="600.0" y="242" font-size="22" fill="#64748b" font-weight="400" text-anchor="middle">같은 모델·전처리로</text><text x="600.0" y="270" font-size="22" fill="#64748b" font-weight="400" text-anchor="middle">질문도 벡터로 변환</text><rect x="830" y="60" width="320" height="232" rx="22" fill="#fff" stroke="#dbe3f0" stroke-width="2"/><circle cx="990.0" cy="126" r="48" fill="#fff0d9"/><g transform="translate(990.0 126) scale(0.85)"><g fill="none" stroke="#a35b16" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"><circle cx="-6" cy="-6" r="20"/><path d="M9 9L30 30" stroke-width="6"/></g></g><circle cx="860" cy="90" r="17" fill="#a35b16"/><text x="860" y="97" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="990.0" y="206" font-size="32" fill="#142e4e" font-weight="700" text-anchor="middle">검색 근거</text><text x="990.0" y="242" font-size="22" fill="#64748b" font-weight="400" text-anchor="middle">가까운 문서를</text><text x="990.0" y="270" font-size="22" fill="#64748b" font-weight="400" text-anchor="middle">생성에 전달</text><text x="405.0" y="188.0" font-size="34" fill="#64748b" font-weight="700" text-anchor="middle">+</text><path d="M768 176.0L822 176.0" stroke="#64748b" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="50" y="352" font-size="24" fill="#64748b" font-weight="700" text-anchor="start">질문 → 근거 문서, 어떤 조건에서 맞을까?</text><rect x="50" y="380" width="1100" height="80" rx="20" fill="#d9f2ea" stroke="#008474" stroke-width="3"/><text x="80" y="430" font-size="26" fill="#008474" font-weight="700" text-anchor="start">같은 모델·전처리</text><text x="380" y="430" font-size="26" fill="#142e4e" font-weight="400" text-anchor="start">질문과 가까운 반품 정책 문서가 선택됨</text><circle cx="1100" cy="420" r="24" fill="#fff" stroke="#008474" stroke-width="4"/><path d="M1088 421L1096 430L1112 411" stroke="#008474" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="480" width="1100" height="80" rx="20" fill="#fff0d9" stroke="#a35b16" stroke-width="3"/><text x="80" y="530" font-size="26" fill="#a35b16" font-weight="700" text-anchor="start">다른 모델·전처리</text><text x="380" y="530" font-size="26" fill="#142e4e" font-weight="400" text-anchor="start">거리가 어긋나 날씨 예보 문서가 선택됨</text><circle cx="1100" cy="520" r="24" fill="#fff" stroke="#a35b16" stroke-width="4"/><path d="M1089 509L1111 531M1111 509L1089 531" stroke="#a35b16" stroke-width="5" stroke-linecap="round"/></g></svg>
