rt">WHERE age = 42</text><text x="66" y="388" font-size="15" fill="#142e4e" font-weight="400" text-anchor="start">→ 30 ≤ 42 &lt; 60 이므로 가운데로</text><text x="66" y="414" font-size="15" fill="#142e4e" font-weight="400" text-anchor="start">값의 크고 작음(순서)으로 내려감</text><rect x="490" y="80" width="440" height="380" rx="14" fill="white"/><text x="510" y="114" font-size="19" fill="#008474" font-weight="700" text-anchor="start">Vector DB · 유사도 검색</text><circle cx="715" cy="260" r="75" fill="#d9f2ea" stroke="#008474" stroke-width="2"/><circle cx="685" cy="217" r="6" fill="#008474"/><circle cx="722" cy="164" r="6" fill="#b9c4d6"/><circle cx="557" cy="414" r="6" fill="#b9c4d6"/><circle cx="568" cy="327" r="6" fill="#b9c4d6"/><circle cx="818" cy="169" r="6" fill="#b9c4d6"/><circle cx="779" cy="249" r="6" fill="#008474"/><circle cx="539" cy="184" r="6" fill="#b9c4d6"/><circle cx="742" cy="354" r="6" fill="#b9c4d6"/><circle cx="555" cy="263" r="6" fill="#b9c4d6"/><circle cx="566" cy="357" r="6" fill="#b9c4d6"/><circle cx="550" cy="203" r="6" fill="#b9c4d6"/><circle cx="634" cy="171" r="6" fill="#b9c4d6"/><circle cx="815" cy="343" r="6" fill="#b9c4d6"/><circle cx="545" cy="253" r="6" fill="#b9c4d6"/><circle cx="543" cy="208" r="6" fill="#b9c4d6"/><circle cx="668" cy="354" r="6" fill="#b9c4d6"/><circle cx="593" cy="416" r="6" fill="#b9c4d6"/><circle cx="580" cy="297" r="6" fill="#b9c4d6"/><circle cx="806" cy="232" r="6" fill="#b9c4d6"/><circle cx="572" cy="236" r="6" fill="#b9c4d6"/><circle cx="710" cy="189" r="6" fill="#b9c4d6"/><circle cx="800" cy="172" r="6" fill="#b9c4d6"/><circle cx="808" cy="170" r="6" fill="#b9c4d6"/><circle cx="836" cy="245" r="6" fill="#b9c4d6"/><circle cx="774" cy="412" r="6" fill="#b9c4d6"/><circle cx="738" cy="300" r="6" fill="#008474"/><polygon points="715.0,247.0 711.6,255.3 702.6,256.0 709.4,261.8 707.4,270.5 715.0,265.9 722.6,270.5 720.6,261.8 727.4,256.0 718.4,255.3" fill="#a35b16" stroke="white" stroke-width="1.5"/><text x="910" y="114" font-size="15" fill="#008474" font-weight="700" text-anchor="end">top-k = 3 (초록)</text><text x="710" y="445" font-size="14" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ORDER BY embedding &lt;=&gt; 질문 LIMIT 3</text><text x="30" y="500" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">1차원 값은 정렬할 수 있지만 384차원 벡터에는 "크다·작다"의 순서가 없어, B+Tree로는 가까운 이웃을</text><text x="30" y="526" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">찾을 수 없습니다. 그래서 벡터는 HNSW·IVF 같은 전용 인덱스를 씁니다 (pgvector도 이 인덱스를 제공).</text></g></svg>