e cx="165" cy="145" r="5" fill="#b9c4d6"/><circle cx="144" cy="163" r="5" fill="#b9c4d6"/><circle cx="115" cy="131" r="5" fill="#b9c4d6"/><text x="150" y="177" font-size="26" fill="#7a869a" font-weight="700" text-anchor="middle">×</text><circle cx="330" cy="150" r="78" fill="#d9f2ea"/><circle cx="330" cy="150" r="78" fill="none" stroke="#008474" stroke-width="2"/><circle cx="286" cy="144" r="5" fill="#008474"/><circle cx="328" cy="147" r="5" fill="#008474"/><circle cx="332" cy="115" r="5" fill="#008474"/><circle cx="329" cy="152" r="5" fill="#008474"/><circle cx="349" cy="129" r="5" fill="#008474"/><circle cx="320" cy="98" r="5" fill="#008474"/><circle cx="318" cy="96" r="5" fill="#008474"/><circle cx="292" cy="180" r="5" fill="#008474"/><circle cx="277" cy="169" r="5" fill="#008474"/><text x="330" y="157" font-size="26" fill="#142e4e" font-weight="700" text-anchor="middle">×</text><circle cx="460" cy="230" r="78" fill="#d9f2ea"/><circle cx="460" cy="230" r="78" fill="none" stroke="#008474" stroke-width="2"/><circle cx="464" cy="226" r="5" fill="#008474"/><circle cx="469" cy="240" r="5" fill="#008474"/><circle cx="486" cy="224" r="5" fill="#008474"/><circle cx="447" cy="217" r="5" fill="#008474"/><circle cx="437" cy="229" r="5" fill="#008474"/><circle cx="439" cy="258" r="5" fill="#008474"/><circle cx="413" cy="203" r="5" fill="#008474"/><circle cx="437" cy="179" r="5" fill="#008474"/><circle cx="497" cy="183" r="5" fill="#008474"/><text x="460" y="237" font-size="26" fill="#142e4e" font-weight="700" text-anchor="middle">×</text><circle cx="210" cy="370" r="78" fill="#e6eaf0"/><circle cx="205" cy="361" r="5" fill="#b9c4d6"/><circle cx="247" cy="325" r="5" fill="#b9c4d6"/><circle cx="238" cy="351" r="5" fill="#b9c4d6"/><circle cx="207" cy="358" r="5" fill="#b9c4d6"/><circle cx="227" cy="340" r="5" fill="#b9c4d6"/><circle cx="209" cy="374" r="5" fill="#b9c4d6"/><circle cx="246" cy="323" r="5" fill="#b9c4d6"/><circle cx="251" cy="395" r="5" fill="#b9c4d6"/><circle cx="202" cy="375" r="5" fill="#b9c4d6"/><text x="210" y="377" font-size="26" fill="#7a869a" font-weight="700" text-anchor="middle">×</text><circle cx="400" cy="390" r="78" fill="#e6eaf0"/><circle cx="387" cy="434" r="5" fill="#b9c4d6"/><circle cx="402" cy="388" r="5" fill="#b9c4d6"/><circle cx="398" cy="388" r="5" fill="#b9c4d6"/><circle cx="396" cy="371" r="5" fill="#b9c4d6"/><circle cx="443" cy="350" r="5" fill="#b9c4d6"/><circle cx="340" cy="388" r="5" fill="#b9c4d6"/><circle cx="398" cy="394" r="5" fill="#b9c4d6"/><circle cx="398" cy="389" r="5" fill="#b9c4d6"/><circle cx="408" cy="413" r="5" fill="#b9c4d6"/><text x="400" y="397" font-size="26" fill="#7a869a" font-weight="700" text-anchor="middle">×</text><polygon points="395.0,241.0 391.3,249.9 381.7,250.7 389.0,256.9 386.8,266.3 395.0,261.3 403.2,266.3 401.0,256.9 408.3,250.7 398.7,249.9" fill="#a35b16" stroke="white" stroke-width="1.5"/><text x="413" y="243" font-size="15" fill="#a35b16" font-weight="700" text-anchor="start">질문</text><text x="290" y="470" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">nprobe = 2: 가까운 군집 2개만 비교 (× = 중심)</text><rect x="570" y="80" width="360" height="124" rx="14" fill="white"/><rect x="570" y="92" width="6" height="100" rx="3" fill="#7a869a"/><text x="592" y="118" font-size="18" fill="#142e4e" font-weight="700" text-anchor="start">Flat (완전 탐색)</text><text x="592" y="150" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="start">모든 벡터와 거리 계산 · 정확</text><text x="592" y="175" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="start">데이터가 늘수록 선형으로 느려짐</text><rect x="570" y="216" width="360" height="124" rx="14" fill="white"/><rect x="570" y="228" width="6" height="100" rx="3" fill="#008474"/><text x="592" y="254" font-size="18" fill="#142e4e" font-weight="700" text-anchor="start">IVF</text><text x="592" y="286" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="start">군집 중심을 먼저 학습(k-means)</text><text x="592" y="311" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="start">nprobe↑ → recall↑ 지연↑</text><rect x="570" y="352" width="360" height="124" rx="14" fill="white"/><rect x="570" y="364" width="6" height="100" rx="3" fill="#a35b16"/><text x="592" y="390" font-size="18" fill="#142e4e" font-weight="700" text-anchor="start">HNSW</text><text x="592" y="422" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="start">다층 이웃 그래프 · 빠르고 정확</text><text x="592" y="447" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="start">메모리 많이 사용 · 삽입이 느림</text><text x="30" y="520" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">근사 검색(ANN)은 정확 검색 결과를 기준으로 recall@k·지연·메모리를 함께 재서 설정을 고릅니다.</text></g></svg>