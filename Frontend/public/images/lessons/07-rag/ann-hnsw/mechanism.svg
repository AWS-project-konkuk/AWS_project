습니다. 그래프 전체를 메모리에 두므로 빠른 대신</text><text x="30" y="601" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">메모리를 많이 쓰고, 삽입할 때마다 이웃 연결을 갱신하므로 색인 구축이 느립니다.</text></g></svg>