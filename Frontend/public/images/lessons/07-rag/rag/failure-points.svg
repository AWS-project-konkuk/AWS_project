<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">답이 틀렸다면 어느 단계일까</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">답이 틀렸다면 어느 단계일까</text><rect x="30" y="85" width="170" height="300" rx="14" fill="white"/><rect x="30" y="85" width="170" height="8" rx="4" fill="#6f55b5"/><circle cx="58" cy="128" r="15" fill="#6f55b5"/><text x="58" y="134" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><text x="82" y="135" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">청킹</text><text x="48" y="180" font-size="14" fill="#b3261e" font-weight="700" text-anchor="start">실패</text><text x="48" y="206" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">너무 작으면 문맥 손실</text><text x="48" y="228" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">너무 크면 잡음 증가</text><text x="48" y="290" font-size="14" fill="#008474" font-weight="700" text-anchor="start">확인</text><rect x="42" y="302" width="146" height="60" rx="8" fill="#f1f5fc"/><text x="115" y="338" font-size="13" fill="#6f55b5" font-weight="700" text-anchor="middle">청크를 직접 읽어 보기</text><path d="M201 235L211 235" fill="none" stroke="#7a869a" stroke-width="2" marker-end="url(#a-gray)"/><rect x="212" y="85" width="170" height="300" rx="14" fill="white"/><rect x="212" y="85" width="170" height="8" rx="4" fill="#456bbb"/><circle cx="240" cy="128" r="15" fill="#456bbb"/><text x="240" y="134" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><text x="264" y="135" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">임베딩</text><text x="230" y="180" font-size="14" fill="#b3261e" font-weight="700" text-anchor="start">실패</text><text x="230" y="206" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">저장·질문 모델 불일치</text><text x="230" y="228" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">도메인 어휘 미반영</text><text x="230" y="290" font-size="14" fill="#008474" font-weight="700" text-anchor="start">확인</text><rect x="224" y="302" width="146" height="60" rx="8" fill="#f1f5fc"/><text x="297" y="338" font-size="13" fill="#456bbb" font-weight="700" text-anchor="middle">같은 모델·버전인가</text><path d="M383 235L393 235" fill="none" stroke="#7a869a" stroke-width="2" marker-end="url(#a-gray)"/><rect x="394" y="85" width="170" height="300" rx="14" fill="white"/><rect x="394" y="85" width="170" height="8" rx="4" fill="#008474"/><circle cx="422" cy="128" r="15" fill="#008474"/><text x="422" y="134" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><text x="446" y="135" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">검색</text><text x="412" y="180" font-size="14" fill="#b3261e" font-weight="700" text-anchor="start">실패</text><text x="412" y="206" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">정답 청크가 top-k 밖</text><text x="412" y="228" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">메타데이터 필터 누락</text><text x="412" y="290" font-size="14" fill="#008474" font-weight="700" text-anchor="start">확인</text><rect x="406" y="302" width="146" height="60" rx="8" fill="#f1f5fc"/><text x="479" y="338" font-size="13" fill="#008474" font-weight="700" text-anchor="middle">recall@k</text><path d="M565 235L575 235" fill="none" stroke="#7a869a" stroke-width="2" marker-end="url(#a-gray)"/><rect x="576" y="85" width="170" height="300" rx="14" fill="white"/><rect x="576" y="85" width="170" height="8" rx="4" fill="#a35b16"/><circle cx="604" cy="128" r="15" fill="#a35b16"/><text x="604" y="134" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><text x="628" y="135" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">프롬프트</text><text x="594" y="180" font-size="14" fill="#b3261e" font-weight="700" text-anchor="start">실패</text><text x="594" y="206" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">근거가 너무 많아</text><text x="594" y="228" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">컨텍스트 창 초과</text><text x="594" y="290" font-size="14" fill="#008474" font-weight="700" text-anchor="start">확인</text><rect x="588" y="302" width="146" height="60" rx="8" fill="#f1f5fc"/><text x="661" y="338" font-size="13" fill="#a35b16" font-weight="700" text-anchor="middle">토큰 수 · 근거 순서</text><path d="M747 235L757 235" fill="none" stroke="#7a869a" stroke-width="2" marker-end="url(#a-gray)"/><rect x="758" y="85" width="170" height="300" rx="14" fill="white"/><rect x="758" y="85" width="170" height="8" rx="4" fill="#b3261e"/><circle cx="786" cy="128" r="15" fill="#b3261e"/><text x="786" y="134" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><text x="810" y="135" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">생성</text><text x="776" y="180" font-size="14" fill="#b3261e" font-weight="700" text-anchor="start">실패</text><text x="776" y="206" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">근거를 무시하고 답함</text><text x="776" y="228" font-size="14" fill="#142e4e" font-weight="400" text-anchor="start">근거 없는데 지어냄</text><text x="776" y="290" font-size="14" fill="#008474" font-weight="700" text-anchor="start">확인</text><rect x="770" y="302" width="146" height="60" rx="8" fill="#f1f5fc"/><text x="843" y="338" font-size="13" fill="#b3261e" font-weight="700" text-anchor="middle">출처 인용 · 답변 보류</text><text x="30" y="425" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">①~③은 "검색 실패", ④~⑤는 "생성 실패"입니다. 검색 결과를 먼저 사람이 확인하고, 근거가 맞는데도</text><text x="30" y="451" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">답이 틀리면 프롬프트·모델을 고칩니다. RAG는 환각을 줄이지만 없애 주지는 않습니다.</text></g></svg>