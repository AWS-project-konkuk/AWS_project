<rect x="97" y="154" width="188" height="67" fill="#075671"/>
<text class="s" x="191" y="184">volumeMounts:</text><text class="s" x="191" y="207">/foo</text>
<rect x="168" y="236" width="188" height="80" fill="#075671"/>
<text class="s" x="262" y="261">Volumes:</text><text class="s" x="262" y="284">PVC</text><text class="s" x="262" y="307">claimName</text>
