<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555">
<rect width="1000" height="555" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#12617a"/></marker>
  <style>
    text{font-family:Arial,'Noto Sans',sans-serif} .t{fill:#fff;font-weight:700;font-size:24px;text-anchor:middle}.s{fill:#fff;font-weight:700;font-size:20px;text-anchor:middle}.orange{fill:#f47e00}.cyan{fill:#04a5d8}.navy{fill:#06516e}.lbl{font-weight:700;font-size:23px;text-anchor:middle}.dash{stroke:#376778;stroke-width:1.6;stroke-dasharray:3.5 5;fill:none}
  </style>
</defs>
<!-- Pod frame -->
