<svg xmlns="http://www.w3.org/2000/svg" width="806" height="452" viewBox="0 0 806 452" role="img" aria-labelledby="title desc">
<title id="title">Pod, PVC, PV의 참조와 바인딩 관계</title>
<desc id="desc">Pod는 PVC를 이름으로 참조하고 PVC는 용량과 접근 모드가 맞는 PV에 바인딩된다</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#3d607e"/></marker><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#18324b}.t{font-size:26px;font-weight:800}.h{font-size:20px;font-weight:800}.b{font-size:14px;font-weight:600}.s{font-size:12px;fill:#587086}</style></defs>
<rect width="806" height="452" rx="24" fill="#f7fafc"/>
<text class="t" x="403" y="43" text-anchor="middle">Pod는 저장소를 직접 고르지 않고 PVC를 요청합니다</text>
<rect x="28" y="74" width="255" height="307" rx="22" fill="#eef3ff" stroke="#7894cb" stroke-width="2"/><text class="h" x="155" y="108" text-anchor="middle">Kubernetes Node</text>
<g transform="translate(63 134)"><path d="M0 35l91-35 91 35-91 35z" fill="#dce7ff" stroke="#5679b5" stroke-width="3"/><path d="M0 35v105l91 39V70l91-35v105l-91 39" fill="#eef3ff" stroke="#5679b5" stroke-width="3"/><text class="h" x="91" y="111" text-anchor="middle">학습 Pod</text><text class="b" x="91" y="137" text-anchor="middle">mountPath</text></g>
<rect x="55" y="328" width="200" height="34" rx="17" fill="white"/><text class="s" x="155" y="350" text-anchor="middle">claimName: training-checkpoints</text>
<path d="M283 227h74" stroke="#3d607e" stroke-width="4" marker-end="url(#a)"/><text class="b" x="320" y="208" text-anchor="middle">이름으로 참조</text>
<g transform="translate(363 114)"><path d="M0 0h176v226H0z" fill="#eaf8f3" stroke="#40977c" stroke-width="3"/><path d="M0 0h126l50 50v176H0z" fill="#eaf8f3" stroke="#40977c" stroke-width="3"/><path d="M126 0v50h50" fill="#c8ebdf" stroke="#40977c" stroke-width="3"/><text class="h" x="88" y="79" text-anchor="middle">PVC</text><text class="b" x="24" y="116">요청 용량: 10Gi</text><text class="b" x="24" y="147">접근 모드: RWO</text><text class="b" x="24" y="178">StorageClass: gp3</text><rect x="23" y="194" width="130" height="24" rx="12" fill="white"/><text class="s" x="88" y="211" text-anchor="middle">저장 요청서</text></g>
<path d="M539 227h65" stroke="#3d607e" stroke-width="4" marker-end="url(#a)"/><text class="b" x="572" y="208" text-anchor="middle">조건 바인딩</text>
<g transform="translate(618 111)"><ellipse cx="76" cy="26" rx="75" ry="25" fill="#ffe0b4" stroke="#b87527" stroke-width="3"/><path d="M1 26v188c0 33 150 33 150 0V26M1 95c0 33 150 33 150 0M1 161c0 33 150 33 150 0" fill="#fff0d8" stroke="#b87527" stroke-width="3"/><text class="h" x="76" y="105" text-anchor="middle">PV</text><text class="b" x="76" y="134" text-anchor="middle">실제 저장 자원</text><text class="s" x="76" y="184" text-anchor="middle">Pod와 수명 분리</text></g>
<rect x="363" y="370" width="406" height="48" rx="14" fill="#fff5e8"/><text class="b" x="566" y="391" text-anchor="middle">PVC는 백업이 아닙니다</text><text class="s" x="566" y="409" text-anchor="middle">삭제와 복구는 기반 저장소와 반환 정책을 함께 확인합니다</text>
</svg>
