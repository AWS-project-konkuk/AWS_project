<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-labelledby="title"><title id="title">서버는 정상인데 모델이 틀리기 시작하면?</title><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="47" font-size="27" fill="#142e4e" font-weight="700">입력 통계와 정답 관계를 따로 관찰</text><text x="30" y="100" font-size="26" fill="#142e4e" font-weight="600">Data Drift · 입력 분포</text><text x="30" y="140" font-size="24" fill="#142e4e" font-weight="400">문장 길이 분포가 달라짐</text><path d="M50 270H650M50 270C120 270 120 170 210 170S290 270 360 270M250 270C350 270 350 170 440 170S530 270 610 270" fill="none" stroke="#456bbb" stroke-width="4"/><text x="130" y="300" font-size="23" fill="#142e4e" font-weight="400">이전</text><text x="430" y="300" font-size="23" fill="#142e4e" font-weight="400">이후</text><text x="30" y="330" font-size="26" fill="#142e4e" font-weight="600">Concept Drift · 정답 관계</text><text x="30" y="370" font-size="24" fill="#142e4e" font-weight="400">같은 표현의 평가 기준이 바뀜</text><text x="45" y="430" font-size="25" fill="#142e4e" font-weight="400">같은 입력 x</text><text x="300" y="430" font-size="25" fill="#142e4e" font-weight="400">이전 y → 이후 y</text></g></svg>