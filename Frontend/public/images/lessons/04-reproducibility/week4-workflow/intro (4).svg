<rect x="91" y="368" width="258" height="53" rx="9" fill="#fff" stroke="#c3d2e4"/><text x="220" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#263b55">Model: model.pkl</text>
