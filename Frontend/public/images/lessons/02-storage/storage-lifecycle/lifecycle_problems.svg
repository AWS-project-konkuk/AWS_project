<svg xmlns="http://www.w3.org/2000/svg" width="806" height="452" viewBox="0 0 403 226" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes 스토리지 문제: 데이터 유실과 공유 불가</title>
<desc id="desc">Pod 재생성 시 파일 소실과 다른 노드에서 파일 공유 불가를 설명하는 두 개의 카드</desc>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f5"/><stop offset="1" stop-color="#fff9f9"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#e4edff"/></linearGradient>
  <style>
    text{font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#25212b}
    .h{font-size:14px;font-weight:800;letter-spacing:-.45px}
    .b{font-size:12.6px;font-weight:500;letter-spacing:-.55px}
    .small{font-size:11px;font-weight:500}
  </style>
</defs>
<rect width="403" height="226" fill="#ffffff"/>
<!-- upper panel -->
<rect x="17.5" y="5.5" width="375" height="98" rx="13" fill="url(#card)" stroke="#ffd0cf" stroke-width="1.2"/>
<!-- warning 1 -->
<path d="M43 13.5 Q44 12 45 14 L55 32.5 Q56 34.5 54 34.5 H33 Q31 34.5 32 32.5Z" fill="#ff816d"/>
<rect x="42.3" y="19" width="3" height="9" rx="1.5" fill="white"/><circle cx="43.8" cy="31" r="1.6" fill="white"/>
<text class="h" x="62" y="29">문제 1. 데이터 유실</text>
<text class="b" x="30" y="57">Pod가 장애로 재생성되면서</text>
<text class="b" x="30" y="78">저장했던 데이터가 사라짐</text>
<!-- lost pod -->
<rect x="218.5" y="35.5" width="59" height="46" rx="9" fill="#f3f5fb" stroke="#b9c9e4" stroke-width="1.3" stroke-dasharray="4 3"/>
<text text-anchor="middle" font-size="13" font-weight="700" x="248" y="54" fill="#465b81">Pod</text>
<text text-anchor="middle" class="small" x="248" y="70" fill="#465b81">(삭제)</text>
<path d="M284 59 H305 M298 53 L305 59 L298 65" stroke="#233957" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="311" y="35" width="60" height="47" rx="10" fill="url(#blue)" stroke="#74afff" stroke-width="1.5"/>
<text text-anchor="middle" x="341" y="54" font-size="13.5" font-weight="800">Pod</text>
<text text-anchor="middle" x="341" y="70" class="small">(재생성)</text>
<path d="M374 28 l4 -7 M381 33 l7 -4 M380 41 h8" stroke="#ffbd37" stroke-width="3" stroke-linecap="round"/>
<!-- lower panel -->
<rect x="17.5" y="126.5" width="375" height="98" rx="13" fill="url(#card)" stroke="#ffd0cf" stroke-width="1.2"/>
<path d="M43 134.5 Q44 133 45 135 L55 153.5 Q56 155.5 54 155.5 H33 Q31 155.5 32 153.5Z" fill="#ff816d"/>
<rect x="42.3" y="140" width="3" height="9" rx="1.5" fill="white"/><circle cx="43.8" cy="152" r="1.6" fill="white"/>
<text class="h" x="62" y="150">문제 2. 데이터 공유 불가</text>
<text class="b" x="30" y="181">한 노드에 저장한 파일을</text>
<text class="b" x="30" y="202">다른 노드의 Pod에서 사용할 수 없음</text>
<!-- storage cylinder -->
<ellipse cx="249" cy="178" rx="13" ry="5.8" fill="#d7e8ff" stroke="#488de0" stroke-width="2"/>
<path d="M236 178 V199 Q249 207 262 199 V178" fill="#d5e6ff" stroke="#488de0" stroke-width="2"/>
<path d="M236 185 Q249 194 262 185 M236 192 Q249 201 262 192" fill="none" stroke="#488de0" stroke-width="2"/>
<ellipse cx="249" cy="178" rx="13" ry="5.8" fill="#d7e8ff" stroke="#488de0" stroke-width="2"/>
<!-- dotted connection, red cross, arrow -->
<path d="M269 189 H286 M312 189 H326" fill="none" stroke="#273a56" stroke-width="2.2" stroke-dasharray="4 3"/>
<path d="M321 184 L327 189 L321 194" fill="none" stroke="#273a56" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M293 181 L307 195 M307 181 L293 195" stroke="#ee5360" stroke-width="4" stroke-linecap="round"/>
<!-- pod cube -->
<path d="M340 181 L355 173 L369 181 L355 190 Z" fill="#f4f2ff" stroke="#8f91ef" stroke-width="2" stroke-linejoin="round"/>
<path d="M340 181 V196 L355 205 V190 M369 181 V196 L355 205" fill="none" stroke="#8f91ef" stroke-width="2" stroke-linejoin="round"/>
</svg>
