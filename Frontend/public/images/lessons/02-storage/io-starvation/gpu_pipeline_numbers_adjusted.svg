<rect x="90" y="284" width="250" height="272" fill="url(#blueGrad)" stroke="#205bbc" stroke-width="2"/>
<ellipse cx="215.0" cy="284" rx="125.0" ry="34" fill="url(#cylTop)" stroke="#205bbc" stroke-width="2"/>
<ellipse cx="215.0" cy="556" rx="125.0" ry="34" fill="url(#blueGrad)" stroke="#205bbc" stroke-width="2" opacity="0.95"/>
