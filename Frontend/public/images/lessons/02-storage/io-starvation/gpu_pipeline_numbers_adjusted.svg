<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d86df"/>
      <stop offset="100%" stop-color="#1f58bf"/>
    </linearGradient>
    <linearGradient id="cylTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fc4f0"/>
      <stop offset="100%" stop-color="#7aa8e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7aa0" />
    </marker>
    <style>
      .titlebox { fill:#eef2f6; rx:18; ry:18; }
      .numbadge { fill:#36597c; }
      .numtext { font: 700 34px 'Arial','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:white; dominant-baseline:middle; text-anchor:middle; }
      .label { font: 700 34px 'Arial','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#0f2747; text-anchor:middle; }
      .small { font: 600 26px 'Arial','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:#0f2747; text-anchor:middle; }
      .boxlabel { font: 700 44px 'Arial','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:white; text-anchor:middle; dominant-baseline:middle; }
      .arrow { fill:none; stroke:#5b7aa0; stroke-width:5; stroke-linecap:round; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

<rect class="titlebox" x="120" y="55" width="290" height="110" rx="18" ry="18"/>
<circle class="numbadge" cx="130" cy="62" r="28"/>
