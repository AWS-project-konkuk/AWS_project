<text class="boxlabel" x="1140.0" y="367.0" font-size="36">GPU</text>
<rect x="1234" y="310" width="120" height="110" rx="8" ry="8" fill="url(#blueGrad)" stroke="#205bbc" stroke-width="2" filter="url(#shadow)"/>
