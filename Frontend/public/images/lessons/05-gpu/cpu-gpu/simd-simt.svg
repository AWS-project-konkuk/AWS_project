<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">한 명령어로 여러 데이터를 처리하는 방식</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">한 명령어로 여러 데이터를 처리하는 방식</text><rect x="30" y="80" width="280" height="400" rx="14" fill="white"/><text x="170" y="115" font-size="19" fill="#a35b16" font-weight="700" text-anchor="middle">스칼라 실행</text><rect x="340" y="80" width="280" height="400" rx="14" fill="white"/><text x="480" y="115" font-size="19" fill="#456bbb" font-weight="700" text-anchor="middle">SIMD (CPU 벡터 명령)</text><rect x="650" y="80" width="280" height="400" rx="14" fill="white"/><text x="790" y="115" font-size="19" fill="#008474" font-weight="700" text-anchor="middle">SIMT (GPU 워프)</text><rect x="50" y="140" width="240" height="48" rx="10" fill="#fff0d9"/><text x="170" y="171" font-size="17" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ADD a0, b0 → c0</text><rect x="50" y="202" width="240" height="48" rx="10" fill="#fff0d9"/><text x="170" y="233" font-size="17" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ADD a1, b1 → c1</text><rect x="50" y="264" width="240" height="48" rx="10" fill="#fff0d9"/><text x="170" y="295" font-size="17" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ADD a2, b2 → c2</text><rect x="50" y="326" width="240" height="48" rx="10" fill="#fff0d9"/><text x="170" y="357" font-size="17" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ADD a3, b3 → c3</text><text x="170" y="440" font-size="17" fill="#4a5d78" font-weight="600" text-anchor="middle">명령 4번 · 데이터 4개</text><rect x="390" y="140" width="180" height="40" rx="20" fill="#456bbb"/><text x="480" y="167" font-size="17" fill="white" font-weight="700" text-anchor="middle">ADD (명령 1번)</text><text x="372" y="238" font-size="18" fill="#4a5d78" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a</text><rect x="390" y="210" width="40" height="42" rx="6" fill="#e0eafe"/><text x="410" y="238" font-size="15" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a0</text><rect x="436" y="210" width="40" height="42" rx="6" fill="#e0eafe"/><text x="456" y="238" font-size="15" fill="#142e4e" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a1</text><rect