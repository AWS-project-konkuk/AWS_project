<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title"><title id="title">학습 중 VRAM을 차지하는 것 (설명용 예시)</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">학습 중 VRAM을 차지하는 것 (설명용 예시)</text><text x="60" y="118" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">FP32 학습</text><rect x="60" y="130" width="118" height="64" rx="6" fill="#fff0d9"/><text x="119.0" y="169" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">가중치 4</text><rect x="180" y="130" width="118" height="64" rx="6" fill="#fff0d9"/><text x="239.0" y="169" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">기울기 4</text><rect x="300" y="130" width="238" height="64" rx="6" fill="#fff0d9"/><text x="419.0" y="169" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">Adam m·v 8</text><rect x="540" y="130" width="238" height="64" rx="6" fill="#e0eafe"/><text x="659.0" y="169" font-size="17" fill="#456bbb" font-weight="700" text-anchor="middle">활성값 8</text><rect x="780" y="130" width="58" height="64" rx="6" fill="#e6eaf0"/><text x="809.0" y="169" font-size="15" fill="#7a869a" font-weight="700" text-anchor="middle">임시</text><text x="848" y="170" font-size="18" fill="#b3261e" font-weight="700" text-anchor="start">OOM</text><path d="M60 210V220H538V210" fill="none" stroke="#142e4e" stroke-width="2"/><text x="300" y="244" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">모델 상태 16GB · 배치와 무관</text><path d="M540 210V220H778V210" fill="none" stroke="#456bbb" stroke-width="2"/><text x="660" y="244" font-size="16" fill="#456bbb" font-weight="600" text-anchor="middle">배치에 비례</text><text x="60" y="298" font-size="19" fill="#142e4e" font-weight="700" text-anchor="start">혼합 정밀도 (autocast)</text><rect x="60" y="310" width="118" height="64" rx="6" fill="#fff0d9"/><text x="119.0" y="349" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">가중치 4</text><rect x="180" y="310" width="118" height="64" rx="6" fill="#fff0d9"/><text x="239.0" y="349" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">기울기 4</text><rect x="300" y="310" width="238" height="64" rx="6" fill="#fff0d9"/><text x="419.0" y="349" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">Adam m·v 8</text><rect x="540" y="310" width="28" height="64" rx="6" fill="#ece6fa"/><text x="554.0" y="349" font-size="15" fill="#6f55b5" font-weight="700" text-anchor="middle"></text><rect x="570" y="310" width="118" height="64" rx="6" fill="#e0eafe"/><text x="629.0" y="349" font-size="17" fill="#456bbb" font-weight="700" text-anchor="middle">활성값 4</text><rect x="690" y="310" width="58" height="64" rx="6" fill="#e6eaf0"/><text x="719.0" y="349" font-size="15" fill="#7a869a" font-weight="700" text-anchor="middle">임시</text><text x="790" y="350" font-size="18" fill="#008474" font-weight="700" text-anchor="start">통과</text><text x="555.0" y="300" font-size="13" fill="#6f55b5" font-weight="600" text-anchor="middle">FP16 사본</text><line x1="780" y1="92" x2="780" y2="392" stroke="#b3261e" stroke-width="3" stroke-dasharray="8 6"/><text x="780" y="86" font-size="16" fill="#b3261e" font-weight="700" text-anchor="middle">VRAM 24GB</text><text x="30" y="430" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">• 예시: 파라미터 10억 개 × 4바이트 = 4GB. Adam은 파라미터마다 상태 2개(m, v)를 FP32로 둡니다.</text><text x="30" y="458" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">• PyTorch autocast는 가중치·기울기를 FP32로 유지하고 연산만 FP16으로 바꾸므로 주로 활성값이 줄어듭니다.</text><text x="30" y="486" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">• 그래서 "혼합 정밀도 = 메모리 절반"이 아니며, 모델 상태가 넘치면 상태 분할이 필요합니다.</text></g></svg>