<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title"><title id="title">autocast와 GradScaler의 한 스텝</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">autocast와 GradScaler의 한 스텝</text><rect x="40" y="100" width="190" height="100" rx="14" fill="white"/><rect x="40" y="112" width="5" height="76" rx="2.5" fill="#a35b16"/><text x="137.0" y="146.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">FP32 가중치</text><text x="137.0" y="172.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">마스터 사본 유지</text><circle cx="54" cy="104" r="15" fill="#a35b16"/><text x="54" y="110" font-size="16" fill="white" font-weight="700" text-anchor="middle">1</text><rect x="270" y="100" width="190" height="100" rx="14" fill="white"/><rect x="270" y="112" width="5" height="76" rx="2.5" fill="#456bbb"/><text x="367.0" y="146.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">autocast 순전파</text><text x="367.0" y="172.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">matmul·conv → FP16</text><circle cx="284" cy="104" r="15" fill="#456bbb"/><text x="284" y="110" font-size="16" fill="white" font-weight="700" text-anchor="middle">2</text><rect x="500" y="100" width="190" height="100" rx="14" fill="white"/><rect x="500" y="112" width="5" height="76" rx="2.5" fill="#a35b16"/><text x="597.0" y="146.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">loss 계산</text><text x="597.0" y="172.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">softmax·loss → FP32</text><circle cx="514" cy="104" r="15" fill="#a35b16"/><text x="514" y="110" font-size="16" fill="white" font-weight="700" text-anchor="middle">3</text><rect x="730" y="100" width="190" height="100" rx="14" fill="white"/><rect x="730" y="112" width="5" height="76" rx="2.5" fill="#6f55b5"/><text x="827.0" y="146.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">loss × S</text><text x="827.0" y="172.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">작은 기울기 보호</text><circle cx="744" cy="104" r="15" fill="#6f55b5"/><text x="744" y="110" font-size="16" fill="white" font-weight="700" text-anchor="middle">4</text><rect x="730" y="290" width="190" height="100" rx="14" fill="white"/><rect x="730" y="302" width="5" height="76" rx="2.5" fill="#456bbb"/><text x="827.0" y="336.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">역전파</text><text x="827.0" y="362.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">기울기도 S배</text><circle cx="744" cy="294" r="15" fill="#456bbb"/><text x="744" y="300" font-size="16" fill="white" font-weight="700" text-anchor="middle">5</text><rect x="500" y="290" width="190" height="100" rx="14" fill="white"/><rect x="500" y="302" width="5" height="76" rx="2.5" fill="#6f55b5"/><text x="597.0" y="336.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">unscale ÷ S</text><text x="597.0" y="362.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">원래 크기로 복원</text><circle cx="514" cy="294" r="15" fill="#6f55b5"/><text x="514" y="300" font-size="16" fill="white" font-weight="700" text-anchor="middle">6</text><rect x="270" y="290" width="190" height="100" rx="14" fill="white"/><rect x="270" y="302" width="5" height="76" rx="2.5" fill="#b3261e"/><text x="367.0" y="336.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">inf·NaN 검사</text><text x="367.0" y="362.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">넘치면 step 건너뜀</text><circle cx="284" cy="294" r="15" fill="#b3261e"/><text x="284" y="300" font-size="16" fill="white" font-weight="700" text-anchor="middle">7</text><rect x="40" y="290" width="190" height="100" rx="14" fill="white"/><rect x="40" y="302" width="5" height="76" rx="2.5" fill="#a35b16"/><text x="137.0" y="336.0" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">optimizer step</text><text x="137.0" y="362.0" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">S는 자동으로 조정</text><circle cx="54" cy="294" r="15" fill="#a35b16"/><text x="54" y="300" font-size="16" fill="white" font-weight="700" text-anchor="middle">8</text><path d="M232 150L266 150" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M462 150L496 150" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M692 150L726 150" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M825 202L825 286" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M728 340L694 340" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M498 340L464 340" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M268 340L234 340" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><path d="M135 288V246" fill="none" stroke="#7a869a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a-gray)"/><text x="150" y="262" font-size="14" fill="#7a869a" font-weight="600" text-anchor="start">다음 스텝</text><text x="40" y="440" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">주황 = FP32, 파랑 = FP16 연산.  ③까지는 autocast, ④~⑧은 GradScaler가 담당합니다.</text><text x="40" y="468" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">BF16은 FP32와 지수 범위가 같아 기울기가 0으로 사라지는 일이 드물어 보통 loss scaling 없이 씁니다.</text></g></svg>