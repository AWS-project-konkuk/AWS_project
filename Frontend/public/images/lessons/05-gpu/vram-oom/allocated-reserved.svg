<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title"><title id="title">nvidia-smi와 PyTorch가 보는 메모리는 다릅니다</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">nvidia-smi와 PyTorch가 보는 메모리는 다릅니다</text><rect x="50" y="90" width="860" height="60" rx="8" fill="white" stroke="#7a869a" stroke-width="1.5"/><rect x="50" y="90" width="80" height="60" rx="8" fill="#e6eaf0"/><text x="90" y="126" font-size="13" fill="#4a5d78" font-weight="600" text-anchor="middle">context</text><rect x="130" y="90" width="380" height="60" rx="0" fill="#e0eafe"/><text x="320" y="126" font-size="17" fill="#456bbb" font-weight="700" text-anchor="middle">텐서가 사용 중</text><rect x="510" y="90" width="220" height="60" rx="0" fill="#f3f6fd" stroke="#456bbb" stroke-width="1.5" stroke-dasharray="5 4"/><text x="620" y="126" font-size="16" fill="#456bbb" font-weight="600" text-anchor="middle">캐시 (비어 있음)</text><text x="820" y="126" font-size="16" fill="#4a5d78" font-weight="600" text-anchor="middle">여유</text><path d="M130 170V180H510V170" fill="none" stroke="#456bbb" stroke-width="2"/><text x="138" y="204" font-size="16" fill="#456bbb" font-weight="700" text-anchor="start">memory_allocated()</text><path d="M130 226V236H730V226" fill="none" stroke="#008474" stroke-width="2"/><text x="138" y="260" font-size="16" fill="#008474" font-weight="700" text-anchor="start">memory_reserved()  ← 캐싱 할당기가 확보한 양</text><path d="M50 282V292H730V282" fill="none" stroke="#a35b16" stroke-width="2"/><text x="58" y="316" font-size="16" fill="#a35b16" font-weight="700" text-anchor="start">nvidia-smi 사용량 ≈ reserved + CUDA context</text><path d="M50 338V348H910V338" fill="none" stroke="#4a5d78" stroke-width="2"/><text x="58" y="372" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="start">get_device_properties(0).total_memory</text><text x="30" y="410" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">del로 참조를 지우면 allocated는 줄지만 reserved는 캐시로 남습니다. empty_cache()는 이 빈 캐시만</text><text x="30" y="436" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">반납할 뿐, 아직 참조 중인 텐서를 지우지 못하므로 같은 프로세스의 OOM을 근본적으로 해결하지는 않습니다.</text></g></svg>