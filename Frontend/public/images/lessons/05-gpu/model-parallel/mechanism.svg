<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">레이어를 GPU별로 나누고 활성값을 넘깁니다</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">레이어를 GPU별로 나누고 활성값을 넘깁니다</text><rect x="40" y="85" width="400" height="200" rx="14" fill="white"/><text x="60" y="118" font-size="20" fill="#a35b16" font-weight="700" text-anchor="start">GPU 1</text><rect x="62" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="102" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L1</text><rect x="154" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="194" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L2</text><rect x="246" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="286" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L3</text><rect x="338" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="378" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L4</text><text x="240" y="268" font-size="14" fill="#4a5d78" font-weight="400" text-anchor="middle">레이어 4개 + 그 레이어의 기울기·옵티마이저 상태</text><rect x="520" y="85" width="400" height="200" rx="14" fill="white"/><text x="540" y="118" font-size="20" fill="#a35b16" font-weight="700" text-anchor="start">GPU 2</text><rect x="542" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="582" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L5</text><rect x="634" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="674" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L6</text><rect x="726" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="766" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L7</text><rect x="818" y="138" width="80" height="100" rx="10" fill="#fff0d9"/><text x="858" y="194" font-size="20" fill="#a35b16" font-weight="700" text-anchor="middle">L8</text><text x="720" y="268" font-size="14" fill="#4a5d78" font-weight="400" text-anchor="middle">레이어 4개 + 그 레이어의 기울기·옵티마이저 상태</text><path d="M442 165L516 165" fill="none" stroke="#456bbb" stroke-width="3" marker-end="url(#a-blue)"/><text x="479" y="152" font-size="15" fill="#456bbb" font-weight="700" text-anchor="middle">활성값</text><path d="M516 215L442 215" fill="none" stroke="#008474" stroke-width="3" marker-end="url(#a-green)"/><text x="479" y="240" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">기울기</text><text x="40" y="330" font-size="17" fill="#142e4e" font-weight="400" text-anchor="start">• 순전파: GPU 1이 L1~L4를 끝내야 GPU 2가 L5를 시작합니다 (활성값 전송).</text><text x="40" y="362" font-size="17" fill="#142e4e" font-weight="400" text-anchor="start">• 역전파: GPU 2가 L5 입력에 대한 기울기를 GPU 1로 돌려보냅니다.</text><text x="40" y="394" font-size="17" fill="#142e4e" font-weight="400" text-anchor="start">• 장치당 메모리는 대략 절반이 되지만, 한쪽이 일하는 동안 다른 쪽은 기다립니다.</text></g></svg>