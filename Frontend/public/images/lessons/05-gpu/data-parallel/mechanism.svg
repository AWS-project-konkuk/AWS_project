<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">DDP 한 스텝: 데이터는 나누고 기울기는 평균</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">DDP 한 스텝: 데이터는 나누고 기울기는 평균</text><rect x="360" y="80" width="240" height="60" rx="14" fill="white"/><rect x="360" y="92" width="5" height="36" rx="2.5" fill="#142e4e"/><text x="482.0" y="117.0" font-size="20" fill="#142e4e" font-weight="700" text-anchor="middle">배치 64</text><path d="M440 142 L240 196" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M520 142 L720 196" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><text x="318" y="160" font-size="15" fill="#4a5d78" font-weight="600" text-anchor="end">32개</text><text x="642" y="160" font-size="15" fill="#4a5d78" font-weight="600" text-anchor="start">32개</text><rect x="60" y="200" width="360" height="150" rx="14" fill="white"/><text x="80" y="232" font-size="20" fill="#008474" font-weight="700" text-anchor="start">GPU 1</text><rect x="80" y="248" width="320" height="40" rx="8" fill="#d9f2ea"/><text x="240" y="274" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">전체 모델 복제본 (가중치 동일)</text><text x="240" y="322" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">forward · backward → 기울기 g1</text><rect x="540" y="200" width="360" height="150" rx="14" fill="white"/><text x="560" y="232" font-size="20" fill="#008474" font-weight="700" text-anchor="start">GPU 2</text><rect x="560" y="248" width="320" height="40" rx="8" fill="#d9f2ea"/><text x="720" y="274" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">전체 모델 복제본 (가중치 동일)</text><text x="720" y="322" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">forward · backward → 기울기 g2</text><rect x="240" y="390" width="480" height="70" rx="14" fill="#e0eafe"/><text x="480" y="420" font-size="19" fill="#456bbb" font-weight="700" text-anchor="middle">All-Reduce (NCCL):  ḡ = (g1 + g2) / 2</text><text x="480" y="446" font-size="15" fill="#4a5d78" font-weight="400" text-anchor="middle">두 GPU가 같은 평균 기울기를 받음</text><path d="M240 352L300 386" fill="none" stroke="#456bbb" stroke-width="3" marker-end="url(#a-blue)"/><path d="M720 352L660 386" fill="none" stroke="#456bbb" stroke-width="3" marker-end="url(#a-blue)"/><path d="M480 462L480 492" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><rect x="240" y="496" width="480" height="56" rx="14" fill="white"/><rect x="240" y="508" width="5" height="32" rx="2.5" fill="#a35b16"/><text x="482.0" y="531.0" font-size="17" fill="#142e4e" font-weight="700" text-anchor="middle">각 GPU가 같은 optimizer step → 가중치가 계속 같게 유지</text><text x="30" y="590" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">가중치를 평균내는 것이 아니라 기울기를 평균냅니다. DDP는 backward 도중 버킷 단위로 All-Reduce를 겹쳐</text><text x="30" y="616" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">통신 시간을 숨깁니다. 각 GPU는 여전히 모델·기울기·옵티마이저 상태 전체를 가집니다.</text></g></svg>