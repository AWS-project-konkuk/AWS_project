<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title"><title id="title">24GiB 학습 상태를 16GiB GPU 두 장에 담기</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">24GiB 학습 상태를 16GiB GPU 두 장에 담기</text><rect x="40" y="80" width="280" height="400" rx="14" fill="white"/><text x="180" y="112" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">데이터 병렬</text><rect x="100" y="132" width="60" height="288" rx="6" fill="#fde4e1" stroke="#b3261e" stroke-width="2"/><text x="130" y="156" font-size="17" fill="#b3261e" font-weight="700" text-anchor="middle">24</text><text x="130" y="442" font-size="14" fill="#4a5d78" font-weight="700" text-anchor="middle">GPU A</text><rect x="200" y="132" width="60" height="288" rx="6" fill="#fde4e1" stroke="#b3261e" stroke-width="2"/><text x="230" y="156" font-size="17" fill="#b3261e" font-weight="700" text-anchor="middle">24</text><text x="230" y="442" font-size="14" fill="#4a5d78" font-weight="700" text-anchor="middle">GPU B</text><line x1="80" y1="228" x2="280" y2="228" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="280" y="220" font-size="13" fill="#b3261e" font-weight="700" text-anchor="end">16GiB</text><text x="180" y="470" font-size="15" fill="#b3261e" font-weight="700" text-anchor="middle">OOM: 장치마다 24GiB</text><rect x="340" y="80" width="280" height="400" rx="14" fill="white"/><text x="480" y="112" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">모델 병렬 (레이어)</text><rect x="400" y="276" width="60" height="144" rx="6" fill="#fff0d9" stroke="#a35b16" stroke-width="2"/><text x="430" y="300" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">12</text><text x="430" y="442" font-size="14" fill="#4a5d78" font-weight="700" text-anchor="middle">GPU A</text><rect x="500" y="276" width="60" height="144" rx="6" fill="#fff0d9" stroke="#a35b16" stroke-width="2"/><text x="530" y="300" font-size="17" fill="#a35b16" font-weight="700" text-anchor="middle">12</text><text x="530" y="442" font-size="14" fill="#4a5d78" font-weight="700" text-anchor="middle">GPU B</text><line x1="380" y1="228" x2="580" y2="228" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="580" y="220" font-size="13" fill="#b3261e" font-weight="700" text-anchor="end">16GiB</text><text x="480" y="470" font-size="15" fill="#a35b16" font-weight="700" text-anchor="middle">12 + 12 · 활성값 전송</text><rect x="640" y="80" width="280" height="400" rx="14" fill="white"/><text x="780" y="112" font-size="18" fill="#142e4e" font-weight="700" text-anchor="middle">텐서 병렬</text><rect x="700" y="276" width="60" height="144" rx="6" fill="#d9f2ea" stroke="#008474" stroke-width="2"/><text x="730" y="300" font-size="17" fill="#008474" font-weight="700" text-anchor="middle">12</text><text x="730" y="442" font-size="14" fill="#4a5d78" font-weight="700" text-anchor="middle">GPU A</text><rect x="800" y="276" width="60" height="144" rx="6" fill="#d9f2ea" stroke="#008474" stroke-width="2"/><text x="830" y="300" font-size="17" fill="#008474" font-weight="700" text-anchor="middle">12</text><text x="830" y="442" font-size="14" fill="#4a5d78" font-weight="700" text-anchor="middle">GPU B</text><line x1="680" y1="228" x2="880" y2="228" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="880" y="220" font-size="13" fill="#b3261e" font-weight="700" text-anchor="end">16GiB</text><text x="780" y="470" font-size="15" fill="#008474" font-weight="700" text-anchor="middle">12 + 12 · 층마다 All-Reduce</text><text x="30" y="525" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">VRAM 합계(32GiB)가 24GiB보다 커도, 장치 하나에 24GiB를 요구하는 배치면 실패합니다.</text><text x="30" y="551" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">ZeRO-3·FSDP처럼 데이터 병렬이면서 가중치·기울기·옵티마이저 상태를 나누는 방식도 선택지입니다.</text></g></svg>