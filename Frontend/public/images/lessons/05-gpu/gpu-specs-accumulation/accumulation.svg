<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="title"><title id="title">마이크로배치 네 번, 모델 갱신 한 번</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">마이크로배치 네 번, 모델 갱신 한 번</text><text x="150" y="100" font-size="15" fill="#142e4e" font-weight="700" text-anchor="middle">마이크로배치 1 (8개)</text><rect x="70" y="112" width="80" height="46" rx="8" fill="#e0eafe"/><text x="110" y="141" font-size="14" fill="#456bbb" font-weight="700" text-anchor="middle">forward</text><rect x="152" y="112" width="80" height="46" rx="8" fill="#d9f2ea"/><text x="192" y="141" font-size="14" fill="#008474" font-weight="700" text-anchor="middle">backward</text><text x="325" y="100" font-size="15" fill="#142e4e" font-weight="700" text-anchor="middle">마이크로배치 2 (8개)</text><rect x="245" y="112" width="80" height="46" rx="8" fill="#e0eafe"/><text x="285" y="141" font-size="14" fill="#456bbb" font-weight="700" text-anchor="middle">forward</text><rect x="327" y="112" width="80" height="46" rx="8" fill="#d9f2ea"/><text x="367" y="141" font-size="14" fill="#008474" font-weight="700" text-anchor="middle">backward</text><text x="500" y="100" font-size="15" fill="#142e4e" font-weight="700" text-anchor="middle">마이크로배치 3 (8개)</text><rect x="420" y="112" width="80" height="46" rx="8" fill="#e0eafe"/><text x="460" y="141" font-size="14" fill="#456bbb" font-weight="700" text-anchor="middle">forward</text><rect x="502" y="112" width="80" height="46" rx="8" fill="#d9f2ea"/><text x="542" y="141" font-size="14" fill="#008474" font-weight="700" text-anchor="middle">backward</text><text x="675" y="100" font-size="15" fill="#142e4e" font-weight="700" text-anchor="middle">마이크로배치 4 (8개)</text><rect x="595" y="112" width="80" height="46" rx="8" fill="#e0eafe"/><text x="635" y="141" font-size="14" fill="#456bbb" font-weight="700" text-anchor="middle">forward</text><rect x="677" y="112" width="80" height="46" rx="8" fill="#d9f2ea"/><text x="717" y="141" font-size="14" fill="#008474" font-weight="700" text-anchor="middle">backward</text><rect x="770" y="112" width="120" height="46" rx="8" fill="#fff0d9"/><text x="830" y="134" font-size="14" fill="#a35b16" font-weight="700" text-anchor="middle">step +</text><text x="830" y="151" font-size="13" fill="#a35b16" font-weight="700" text-anchor="middle">zero_grad</text><text x="30" y="200" font-size="17" fill="#456bbb" font-weight="700" text-anchor="start">활성값 메모리</text><path d="M70 350 L150 315 L232 350 L245 350 L325 315 L407 350 L420 350 L500 315 L582 350 L595 350 L675 315 L757 350 L770 350" fill="none" stroke="#456bbb" stroke-width="3"/><line x1="220" y1="215" x2="770" y2="215" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 6"/><text x="780" y="220" font-size="14" fill="#b3261e" font-weight="700" text-anchor="start">배치 32를 한 번에</text><text x="780" y="240" font-size="13" fill="#b3261e" font-weight="600" text-anchor="start">(약 4배)</text><text x="780" y="320" font-size="14" fill="#456bbb" font-weight="700" text-anchor="start">최고점 = 1개 몫</text><line x1="70" y1="350" x2="890" y2="350" stroke="#c9d4e6" stroke-width="1.5"/><text x="30" y="400" font-size="17" fill="#a35b16" font-weight="700" text-anchor="start">기울기 버퍼 (.grad에 누적)</text><rect x="80" y="416" width="150" height="30" rx="6" fill="white" stroke="#a35b16" stroke-width="1.5"/><rect x="80" y="416" width="37.5" height="30" rx="6" fill="#fff0d9"/><text x="155" y="437" font-size="14" fill="#a35b16" font-weight="700" text-anchor="middle">1/4 누적</text><rect x="255" y="416" width="150" height="30" rx="6" fill="white" stroke="#a35b16" stroke-width="1.5"/><rect x="255" y="416" width="75.0" height="30" rx="6" fill="#fff0d9"/><text x="330" y="437" font-size="14" fill="#a35b16" font-weight="700" text-anchor="middle">2/4 누적</text><rect x="430" y="416" width="150" height="30" rx="6" fill="white" stroke="#a35b16" stroke-width="1.5"/><rect x="430" y="416" width="112.5" height="30" rx="6" fill="#fff0d9"/><text x="505" y="437" font-size="14" fill="#a35b16" font-weight="700" text-anchor="middle">3/4 누적</text><rect x="605" y="416" width="150" height="30" rx="6" fill="white" stroke="#a35b16" stroke-width="1.5"/><rect x="605" y="416" width="150.0" height="30" rx="6" fill="#fff0d9"/><text x="680" y="437" font-size="14" fill="#a35b16" font-weight="700" text-anchor="middle">4/4 누적</text><text x="30" y="495" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">유효 배치 = 마이크로배치 8 × 누적 4 = 32.  각 loss를 누적 횟수 4로 나눈 뒤 backward 합니다.</text><text x="30" y="523" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">기울기 버퍼 크기는 파라미터 수와 같으므로, 누적 횟수를 늘려도 이 공간은 늘거나 줄지 않습니다.</text></g></svg>