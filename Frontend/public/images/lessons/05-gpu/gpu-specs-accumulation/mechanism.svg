<svg xmlns="http://www.w3.org/2000/svg" width="960" height="555" viewBox="0 0 960 555" role="img" aria-labelledby="title"><title id="title">GPU 사양은 네 가지 질문으로 읽습니다</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">GPU 사양은 네 가지 질문으로 읽습니다</text><rect x="30" y="80" width="445" height="200" rx="14" fill="white"/><rect x="30" y="80" width="445" height="8" rx="4" fill="#456bbb"/><text x="54" y="128" font-size="22" fill="#142e4e" font-weight="700" text-anchor="start">VRAM 용량</text><text x="451" y="128" font-size="18" fill="#456bbb" font-weight="700" text-anchor="end">들어가는가?</text><text x="54" y="168" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">모델 상태 + 활성값 + 임시 공간</text><text x="54" y="194" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">부족하면 OOM</text><rect x="50" y="220" width="405" height="40" rx="8" fill="#f1f5fc"/><text x="252" y="246" font-size="15" fill="#456bbb" font-weight="600" text-anchor="middle">T4 16GB · H100 80GB · H200 141GB</text><rect x="485" y="80" width="445" height="200" rx="14" fill="white"/><rect x="485" y="80" width="445" height="8" rx="4" fill="#008474"/><text x="509" y="128" font-size="22" fill="#142e4e" font-weight="700" text-anchor="start">메모리 대역폭</text><text x="906" y="128" font-size="18" fill="#008474" font-weight="700" text-anchor="end">얼마나 빨리 읽는가?</text><text x="509" y="168" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">메모리 이동이 병목인 연산의 속도</text><text x="509" y="194" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">LLM 추론의 토큰 생성 속도</text><rect x="505" y="220" width="405" height="40" rx="8" fill="#f1f5fc"/><text x="707" y="246" font-size="15" fill="#008474" font-weight="600" text-anchor="middle">T4 0.3 · A100 2.0 · H200 4.8 TB/s</text><rect x="30" y="295" width="445" height="200" rx="14" fill="white"/><rect x="30" y="295" width="445" height="8" rx="4" fill="#a35b16"/><text x="54" y="343" font-size="22" fill="#142e4e" font-weight="700" text-anchor="start">정밀도별 연산 성능</text><text x="451" y="343" font-size="18" fill="#a35b16" font-weight="700" text-anchor="end">얼마나 빨리 계산하는가?</text><text x="54" y="383" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">Tensor Core가 지원하는 형식</text><text x="54" y="409" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">FP16·BF16 → FP8(H100) → FP4(B200)</text><rect x="50" y="435" width="405" height="40" rx="8" fill="#f1f5fc"/><text x="252" y="461" font-size="15" fill="#a35b16" font-weight="600" text-anchor="middle">TFLOPS는 정밀도마다 다름</text><rect x="485" y="295" width="445" height="200" rx="14" fill="white"/><rect x="485" y="295" width="445" height="8" rx="4" fill="#6f55b5"/><text x="509" y="343" font-size="22" fill="#142e4e" font-weight="700" text-anchor="start">GPU 간 연결</text><text x="906" y="343" font-size="18" fill="#6f55b5" font-weight="700" text-anchor="end">나누면 얼마나 드는가?</text><text x="509" y="383" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">기울기·활성값을 주고받는 속도</text><text x="509" y="409" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">NVLink ≫ PCIe</text><rect x="505" y="435" width="405" height="40" rx="8" fill="#f1f5fc"/><text x="707" y="461" font-size="15" fill="#6f55b5" font-weight="600" text-anchor="middle">분산 학습의 통신 비용</text><text x="30" y="530" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">수치는 대표 구성의 대략값입니다. 같은 이름의 GPU도 SXM·PCIe·NVL 등 구성에 따라 다릅니다.</text></g></svg>