<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title"><title id="title">MLP 한 층을 두 GPU가 나눠 계산하기</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">MLP 한 층을 두 GPU가 나눠 계산하기</text><text x="105" y="100" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">입력 X</text><text x="270" y="100" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">A 열 분할</text><text x="435" y="100" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">Y = GeLU(XA)</text><text x="600" y="100" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">B 행 분할</text><text x="765" y="100" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">Z = Y·B</text><text x="30" y="268" font-size="1" fill="#142e4e" font-weight="400" text-anchor="start"></text><rect x="30" y="118" width="820" height="140" rx="14" fill="white"/><text x="46" y="142" font-size="16" fill="#456bbb" font-weight="700" text-anchor="start">GPU 1</text><rect x="40.0" y="166.0" width="130" height="70" rx="8" fill="#e6eaf0"/><text x="105" y="208" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">X (전체)</text><rect x="240.0" y="156.0" width="60" height="90" rx="8" fill="#e0eafe"/><text x="270" y="208" font-size="16" fill="#456bbb" font-weight="700" text-anchor="middle">A1</text><rect x="370.0" y="166.0" width="130" height="70" rx="8" fill="#e0eafe"/><text x="435" y="208" font-size="16" fill="#456bbb" font-weight="700" text-anchor="middle">Y1</text><rect x="535.0" y="178.5" width="130" height="45" rx="8" fill="#e0eafe"/><text x="600" y="208" font-size="16" fill="#456bbb" font-weight="700" text-anchor="middle">B1</text><rect x="700.0" y="166.0" width="130" height="70" rx="8" fill="#e0eafe"/><text x="765" y="208" font-size="16" fill="#456bbb" font-weight="700" text-anchor="middle">Z1 (부분합)</text><path d="M172 201L236 201" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M305 201L368 201" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M502 201L533 201" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M667 201L698 201" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><text x="30" y="440" font-size="1" fill="#142e4e" font-weight="400" text-anchor="start"></text><rect x="30" y="290" width="820" height="140" rx="14" fill="white"/><text x="46" y="314" font-size="16" fill="#008474" font-weight="700" text-anchor="start">GPU 2</text><rect x="40.0" y="338.0" width="130" height="70" rx="8" fill="#e6eaf0"/><text x="105" y="380" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="middle">X (전체)</text><rect x="240.0" y="328.0" width="60" height="90" rx="8" fill="#d9f2ea"/><text x="270" y="380" font-size="16" fill="#008474" font-weight="700" text-anchor="middle">A2</text><rect x="370.0" y="338.0" width="130" height="70" rx="8" fill="#d9f2ea"/><text x="435" y="380" font-size="16" fill="#008474" font-weight="700" text-anchor="middle">Y2</text><rect x="535.0" y="350.5" width="130" height="45" rx="8" fill="#d9f2ea"/><text x="600" y="380" font-size="16" fill="#008474" font-weight="700" text-anchor="middle">B2</text><rect x="700.0" y="338.0" width="130" height="70" rx="8" fill="#d9f2ea"/><text x="765" y="380" font-size="16" fill="#008474" font-weight="700" text-anchor="middle">Z2 (부분합)</text><path d="M172 373L236 373" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M305 373L368 373" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M502 373L533 373" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><path d="M667 373L698 373" fill="none" stroke="#142e4e" stroke-width="2.5" marker-end="url(#a-navy)"/><rect x="870" y="118" width="70" height="312" rx="12" fill="#fff0d9"/><text x="905" y="265" font-size="15" fill="#a35b16" font-weight="700" text-anchor="middle">All-</text><text x="905" y="285" font-size="15" fill="#a35b16" font-weight="700" text-anchor="middle">Reduce</text><path d="M852 201L866 201" fill="none" stroke="#a35b16" stroke-width="2.5" marker-end="url(#a-orange)"/><path d="M852 373L866 373" fill="none" stroke="#a35b16" stroke-width="2.5" marker-end="url(#a-orange)"/><text x="905" y="460" font-size="15" fill="#a35b16" font-weight="700" text-anchor="middle">Z=Z1+Z2</text><text x="30" y="495" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">열 분할 → 행 분할 순서로 두면 GeLU를 GPU마다 따로 계산할 수 있어 층 중간에는 통신이 없고,</text><text x="30" y="521" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">끝에서 All-Reduce 한 번으로 합칩니다. Attention 블록도 같은 방식이라 레이어마다 통신이 반복되므로,</text><text x="30" y="547" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">보통 NVLink로 연결된 한 노드 안의 GPU끼리 묶습니다. (Megatron-LM 방식)</text></g></svg>