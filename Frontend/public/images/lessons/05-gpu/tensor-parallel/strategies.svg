<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title"><title id="title">세 가지 병렬 전략은 무엇을 나누는가</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">세 가지 병렬 전략은 무엇을 나누는가</text><rect x="30" y="80" width="900" height="360" rx="14" fill="white"/><rect x="230" y="92" width="221" height="48" rx="10" fill="#e0eafe"/><text x="340" y="123" font-size="18" fill="#456bbb" font-weight="700" text-anchor="middle">데이터 병렬</text><text x="340" y="182" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">배치(데이터)</text><text x="340" y="238" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">전체 복제본</text><text x="340" y="294" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">기울기 (All-Reduce)</text><text x="340" y="350" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">step마다</text><text x="340" y="406" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">학습 속도</text><rect x="463" y="92" width="221" height="48" rx="10" fill="#fff0d9"/><text x="573" y="123" font-size="18" fill="#a35b16" font-weight="700" text-anchor="middle">파이프라인 병렬</text><text x="573" y="182" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">레이어 묶음</text><text x="573" y="238" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">일부 레이어</text><text x="573" y="294" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">경계의 활성값</text><text x="573" y="350" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">마이크로배치마다</text><text x="573" y="406" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">모델 크기</text><rect x="696" y="92" width="221" height="48" rx="10" fill="#d9f2ea"/><text x="806" y="123" font-size="18" fill="#008474" font-weight="700" text-anchor="middle">텐서 병렬</text><text x="806" y="182" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">레이어 안의 행렬</text><text x="806" y="238" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">행렬 조각</text><text x="806" y="294" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">부분 결과 (All-Reduce)</text><text x="806" y="350" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">레이어마다 여러 번</text><text x="806" y="406" font-size="16" fill="#142e4e" font-weight="600" text-anchor="middle">모델 크기·층 크기</text><text x="50" y="182" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="start">나누는 것</text><text x="50" y="238" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="start">GPU마다 가진 모델</text><line x1="45" y1="210" x2="915" y2="210" stroke="#c9d4e6" stroke-width="1"/><text x="50" y="294" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="start">주고받는 것</text><line x1="45" y1="266" x2="915" y2="266" stroke="#c9d4e6" stroke-width="1"/><text x="50" y="350" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="start">통신 빈도</text><line x1="45" y1="322" x2="915" y2="322" stroke="#c9d4e6" stroke-width="1"/><text x="50" y="406" font-size="16" fill="#4a5d78" font-weight="700" text-anchor="start">해결하는 문제</text><line x1="45" y1="378" x2="915" y2="378" stroke="#c9d4e6" stroke-width="1"/><text x="30" y="475" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">대규모 학습은 셋을 조합합니다(3D 병렬). 통신이 잦은 텐서 병렬은 NVLink로 묶인 노드 안에,</text><text x="30" y="501" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">파이프라인·데이터 병렬은 노드 사이로 확장합니다. ZeRO·FSDP는 데이터 병렬이면서 모델 상태를 나눕니다.</text></g></svg>