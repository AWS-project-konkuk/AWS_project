<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title"><title id="title">torch.matmul 한 줄이 GPU에 도달하는 경로</title><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#142e4e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#456bbb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008474"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a35b16"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a869a"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f55b5"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="48" font-size="27" fill="#142e4e" font-weight="700">torch.matmul 한 줄이 GPU에 도달하는 경로</text><rect x="80" y="85" width="850" height="80" rx="14" fill="white"/><rect x="80" y="85" width="10" height="80" rx="5" fill="#6f55b5"/><text x="110" y="119" font-size="21" fill="#142e4e" font-weight="700" text-anchor="start">ML 프레임워크</text><text x="110" y="147" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">PyTorch · TensorFlow · JAX</text><rect x="590" y="105" width="320" height="40" rx="8" fill="#f1f5fc"/><text x="750" y="131" font-size="16" fill="#6f55b5" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">torch.matmul(a, b)</text><rect x="80" y="179" width="850" height="80" rx="14" fill="white"/><rect x="80" y="179" width="10" height="80" rx="5" fill="#456bbb"/><text x="110" y="213" font-size="21" fill="#142e4e" font-weight="700" text-anchor="start">CUDA 라이브러리</text><text x="110" y="241" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">cuBLAS 행렬 · cuDNN 합성곱 · NCCL 통신</text><rect x="590" y="199" width="320" height="40" rx="8" fill="#f1f5fc"/><text x="750" y="225" font-size="16" fill="#456bbb" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cublasGemmEx(...)</text><rect x="80" y="273" width="850" height="80" rx="14" fill="white"/><rect x="80" y="273" width="10" height="80" rx="5" fill="#008474"/><text x="110" y="307" font-size="21" fill="#142e4e" font-weight="700" text-anchor="start">CUDA Runtime</text><text x="110" y="335" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">cudart · 메모리 할당 · 커널 실행 · 스트림</text><rect x="590" y="293" width="320" height="40" rx="8" fill="#f1f5fc"/><text x="750" y="319" font-size="16" fill="#008474" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">cudaMalloc · 커널 실행</text><rect x="80" y="367" width="850" height="80" rx="14" fill="white"/><rect x="80" y="367" width="10" height="80" rx="5" fill="#a35b16"/><text x="110" y="401" font-size="21" fill="#142e4e" font-weight="700" text-anchor="start">CUDA Driver</text><text x="110" y="429" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">장치 제어 · 컨텍스트 · 커널을 GPU에 제출</text><rect x="590" y="387" width="320" height="40" rx="8" fill="#f1f5fc"/><text x="750" y="413" font-size="16" fill="#a35b16" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">nvidia-smi의 Driver 버전</text><rect x="80" y="461" width="850" height="80" rx="14" fill="white"/><rect x="80" y="461" width="10" height="80" rx="5" fill="#7a869a"/><text x="110" y="495" font-size="21" fill="#142e4e" font-weight="700" text-anchor="start">GPU 하드웨어</text><text x="110" y="523" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">SM · CUDA/Tensor Core · VRAM</text><rect x="590" y="481" width="320" height="40" rx="8" fill="#f1f5fc"/><text x="750" y="507" font-size="16" fill="#7a869a" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Tesla T4 · A100 · H100</text><path d="M50 100L50 530" fill="none" stroke="#142e4e" stroke-width="3" marker-end="url(#a-navy)"/><text x="38" y="330" font-size="16" fill="#4a5d78" font-weight="600" text-anchor="middle" transform="rotate(-90 38 330)">호출 방향</text><text x="30" y="585" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">pip로 설치한 PyTorch에는 Runtime·cuBLAS·cuDNN이 함께 들어 있어, 호스트에는 그 버전을 지원하는</text><text x="30" y="608" font-size="16" fill="#4a5d78" font-weight="400" text-anchor="start">드라이버만 있으면 됩니다. nvidia-smi의 "CUDA Version"은 드라이버가 지원하는 최대 버전입니다.</text></g></svg>