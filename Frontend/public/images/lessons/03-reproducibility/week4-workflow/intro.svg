<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title"><title id="title">캐시에 v1이 없을 때 무엇을 복원해야 할까요?</title><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="35" y="54" font-size="28" fill="#142e4e">캐시에 v1이 없을 때 무엇을</text><text x="35" y="92" font-size="28" fill="#142e4e">복원해야 할까요?</text><circle cx="88" cy="185" r="57" fill="#e0eafe"/><g transform="translate(88 185)" fill="none" stroke="#456bbb" stroke-width="3.5" stroke-linejoin="round"><path d="M-25 -37H9L29 -17V37H-25Z"/><path d="M9 -37V-17H29M-14 -4H17M-14 9H17M-14 22H7"/></g><text x="170" y="169" font-size="18" fill="#456bbb" font-weight="700">01</text><text x="170" y="205" font-size="28" fill="#142e4e" font-weight="400">v1 메타데이터</text><circle cx="88" cy="327" r="57" fill="#d9f2ea"/><g transform="translate(88 327)" fill="none" stroke="#008474" stroke-width="3.5" stroke-linejoin="round"><rect x="-30" y="-30" width="60" height="60" rx="12"/><path d="M-18 0H18M0 -18V18"/></g><text x="170" y="311" font-size="18" fill="#008474" font-weight="700">02</text><text x="170" y="347" font-size="28" fill="#142e4e" font-weight="400">데이터 원격</text><circle cx="88" cy="469" r="57" fill="#fff0d9"/><g transform="translate(88 469)" fill="none" stroke="#a35b16" stroke-width="3.5" stroke-linejoin="round"><path d="M-25 -37H9L29 -17V37H-25Z"/><path d="M9 -37V-17H29M-14 -4H17M-14 9H17M-14 22H7"/></g><text x="170" y="453" font-size="18" fill="#a35b16" font-weight="700">03</text><text x="170" y="489" font-size="28" fill="#142e4e" font-weight="400">v1 작업 파일</text></g></svg>