apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ required "backend.image.tag 를 지정하세요" .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          {{- with .Values.backend.existingSecret }}
          # Secret 의 값(.env 전체: SUPABASE_DB_URL, VLLM_API_KEY, VLLM_BASE_URL)을 환경변수로 넣는다
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            {{- with .Values.backend.vllm.model }}
            - name: VLLM_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.backend.cors.allowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.backend.javaOpts | quote }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}