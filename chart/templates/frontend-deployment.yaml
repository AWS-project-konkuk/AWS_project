apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag 를 지정하세요" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: BACKEND_HOST
              value: {{ .Release.Name }}-backend
            - name: BACKEND_PORT
              value: {{ .Values.backend.port | quote }}
            - name: BASE_PATH
              value: "/{{ .Release.Namespace }}"
            - name: SITE_URL
              value: {{ .Values.frontend.siteUrl | default "" | trimSuffix "/" | quote }}
          readinessProbe:
            httpGet:
              path: "/{{ .Release.Namespace }}/health"
              port: {{ .Values.frontend.port }}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}