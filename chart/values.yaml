ingress:
  enabled: false
  className: nginx
  annotations: {}

backend:
  image:
    repository: blockml-backend
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  # 비밀값(.env)을 담은 Secret 이름. 배포 전에 kubectl create secret 으로 만든다
  existingSecret: backend-secret
  vllm:
    model: ""
  cors:
    allowedOrigins: ""
  javaOpts: "-XX:MaxRAMPercentage=70"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

frontend:
  image:
    repository: blockml-frontend
    tag: ""
    pullPolicy: IfNotPresent
  port: 80
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
