<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">VM과 컨테이너의 실행 계층 비교</title>
  <desc id="desc">VM은 가상 머신별 게스트 커널을 사용하고 컨테이너 프로세스는 호스트 커널을 공유합니다.</desc>
  <rect width="960" height="390" rx="20" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle">
    <text x="245" y="42" fill="#0f172a" font-weight="bold">가상 머신 · 게스트 커널 분리</text>
    <text x="715" y="42" fill="#0f172a" font-weight="bold">컨테이너 · 호스트 커널 공유</text>
    <g fill="#e0e7ff" stroke="#818cf8"><rect x="40" y="65" width="195" height="58" rx="8"/><rect x="255" y="65" width="195" height="58" rx="8"/><rect x="40" y="135" width="195" height="58" rx="8"/><rect x="255" y="135" width="195" height="58" rx="8"/></g>
    <g fill="#0f172a"><text x="137" y="101">애플리케이션 A</text><text x="352" y="101">애플리케이션 B</text><text x="137" y="171">게스트 커널 A</text><text x="352" y="171">게스트 커널 B</text></g>
    <rect x="40" y="207" width="410" height="58" rx="8" fill="#c7d2fe"/><text x="245" y="243" fill="#312e81">하이퍼바이저</text>
    <rect x="40" y="279" width="410" height="58" rx="8" fill="#334155"/><text x="245" y="315" fill="white">호스트 시스템 · 하드웨어</text>
    <g fill="#ccfbf1" stroke="#2dd4bf"><rect x="510" y="65" width="195" height="128" rx="8"/><rect x="725" y="65" width="195" height="128" rx="8"/></g>
    <g fill="#134e4a"><text x="607" y="111">컨테이너 A</text><text x="607" y="149">프로세스·라이브러리</text><text x="822" y="111">컨테이너 B</text><text x="822" y="149">프로세스·라이브러리</text></g>
    <rect x="510" y="207" width="410" height="58" rx="8" fill="#99f6e4"/><text x="715" y="243" fill="#134e4a">공유 호스트 커널 · 격리와 자원 제어</text>
    <rect x="510" y="279" width="410" height="58" rx="8" fill="#334155"/><text x="715" y="315" fill="white">하드웨어</text>
    <text x="480" y="368" fill="#475569" font-size="14">Linux 개념도 · Docker Desktop은 Linux VM 위에서 컨테이너를 실행할 수 있습니다.</text>
  </g>
</svg>
