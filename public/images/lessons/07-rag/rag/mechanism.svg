<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title"><title id="title">검색 결과는 생성 모델에 어떻게 도착할까</title><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="45" font-size="27" fill="#142e4e">출발 · 전달 자료 · 도착</text><rect x="25" y="85" width="670" height="150" rx="16" fill="white"/><text x="43" y="120" font-size="24" fill="#142e4e">질문 임베딩</text><text x="425" y="120" font-size="24" fill="#142e4e">유사도 검색</text><path d="M330 130H400L389 122M400 130L389 138" fill="none" stroke="#456bbb" stroke-width="3"/><text x="43" y="205" font-size="24" fill="#008474">질문 벡터</text><rect x="25" y="265" width="670" height="150" rx="16" fill="white"/><text x="43" y="300" font-size="24" fill="#142e4e">문서 벡터 색인</text><text x="425" y="300" font-size="24" fill="#142e4e">유사도 검색</text><path d="M330 310H400L389 302M400 310L389 318" fill="none" stroke="#456bbb" stroke-width="3"/><text x="43" y="385" font-size="24" fill="#008474">문서 색인</text><rect x="25" y="445" width="670" height="150" rx="16" fill="white"/><text x="43" y="480" font-size="24" fill="#142e4e">유사도 검색</text><text x="425" y="480" font-size="24" fill="#142e4e">근거 기반 생성</text><path d="M330 490H400L389 482M400 490L389 498" fill="none" stroke="#456bbb" stroke-width="3"/><text x="43" y="565" font-size="24" fill="#008474">검색한 문서 근거</text></g></svg>