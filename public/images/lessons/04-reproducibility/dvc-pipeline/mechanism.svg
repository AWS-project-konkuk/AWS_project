<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title"><title id="title">학습 코드가 바뀌면 평가도 영향을 받을까</title><rect width="100%" height="100%" rx="24" fill="#f1f5fc"/><g font-family="system-ui, sans-serif"><text x="30" y="45" font-size="27" fill="#142e4e">출발 · 전달 자료 · 도착</text><rect x="25" y="85" width="670" height="150" rx="16" fill="white"/><text x="43" y="120" font-size="24" fill="#142e4e">전처리 결과</text><text x="425" y="120" font-size="24" fill="#142e4e">학습 단계</text><path d="M330 130H400L389 122M400 130L389 138" fill="none" stroke="#456bbb" stroke-width="3"/><text x="43" y="205" font-size="24" fill="#008474">학습 자료</text><rect x="25" y="265" width="670" height="150" rx="16" fill="white"/><text x="43" y="300" font-size="24" fill="#142e4e">학습 단계</text><text x="425" y="300" font-size="24" fill="#142e4e">평가 단계</text><path d="M330 310H400L389 302M400 310L389 318" fill="none" stroke="#456bbb" stroke-width="3"/><text x="43" y="385" font-size="24" fill="#008474">학습 모델</text><rect x="25" y="445" width="670" height="150" rx="16" fill="white"/><text x="43" y="480" font-size="24" fill="#142e4e">전처리 결과</text><text x="425" y="480" font-size="24" fill="#142e4e">평가 단계</text><path d="M330 490H400L389 482M400 490L389 498" fill="none" stroke="#456bbb" stroke-width="3"/><text x="43" y="565" font-size="24" fill="#008474">별도 평가 자료</text></g></svg>