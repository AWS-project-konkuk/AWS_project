# vLLM server root URL. Do not append /v1 or /chat/completions.
vllm.base-url=https://dolphin-activity-dealing.ngrok-free.dev

# Set the exact model name served by your vLLM server.
vllm.model=qwen3:8b

# Leave empty if authentication is disabled. Can also use VLLM_API_KEY.
vllm.api-key=${VLLM_API_KEY:}

# Connection timeout and response timeout.
vllm.connect-timeout=5s
vllm.read-timeout=120s

# UTF-8 text prepended as a system message. Restart after editing.
vllm.system-prompt=classpath:prompts/system.txt
